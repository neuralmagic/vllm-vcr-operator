# A directly submitted GPU-requesting Pod.
#
# The operator admits controller-created Pods and directly submitted Pods through
# the same webhook, so this example exists to exercise the second path: no
# Deployment, no ReplicaSet, no controller to recreate it. It is the smallest
# workload that demonstrates the acceptance interface.
#
# The Pod requests one GPU, serves on the inference port, and carries the llm-d
# discovery label. It has no simulator opt-in: admission detects the GPU request.
apiVersion: v1
kind: Pod
metadata:
  name: vllm-smoke
  namespace: vllm-vcr-simulated
  labels:
    llm-d.ai/model: qwen3-0-6b
    llm-d.ai/inference-serving: "true"
spec:
  serviceAccountName: mock-pc-sa
  restartPolicy: Never
  containers:
    - name: modelserver
      image: vllm/vllm-openai:v0.33.0
      imagePullPolicy: IfNotPresent
      command:
        - vllm
        - serve
      args:
        - Qwen/Qwen3-0.6B
        - --served-model-name=Qwen/Qwen3-0.6B
        - --tensor-parallel-size=1
        - --max-model-len=16384
        - --max-num-seqs=8
        - --enable-prefix-caching
      ports:
        - name: modelserver
          containerPort: 8000
          protocol: TCP
      env:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_DISABLE_XET
          value: "1"
      readinessProbe:
        httpGet:
          path: /v1/models
          port: modelserver
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: modelserver
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          nvidia.com/gpu: "1"
        limits:
          memory: 4Gi
          nvidia.com/gpu: "1"
