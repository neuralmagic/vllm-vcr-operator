# CRDs only. VcrGpuCluster is cluster scoped (the singleton configuration);
# VcrGpuProfile is namespaced (a workload owner's choice of recording).
# Schemas are generated by controller-gen from api/v1alpha1 (see `make
# manifests`). Do not hand-edit config/crd/bases; hack/verify-manifests.sh fails
# when it is stale.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - bases/vcr.opendatahub-io_vcrgpuclusters.yaml
  - bases/vcr.opendatahub-io_vcrgpuprofiles.yaml
