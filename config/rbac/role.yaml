# Cluster-scoped operator permissions.
#
# Generated by controller-gen from kubebuilder RBAC markers in api/, internal/
# controller, and internal/webhook (`make manifests` writes this file). The rule
# set below is the complete permission set the operator needs today; see
# config/README.md ("RBAC") for the rationale per resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  # Admission reads Pods cluster-wide (any namespace's workload is a candidate)
  # and never writes them: the patch is returned in the AdmissionReview.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  # Pull-secret projection: read the sources in the operator namespace, and
  # create/update the operator-managed copy in the workload namespace. Values
  # never appear in status, logs, or annotations.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Device-plugin reconciliation writes the device-count ConfigMap the plugin
  # polls, so advertised capacity follows spec.devicesPerNode.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The device-plugin DaemonSet runs as a dedicated ServiceAccount so a platform
  # can grant kubelet's socket directory (hostPath) to that workload alone. On
  # OpenShift the install script binds hostmount-anyuid to it.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Device-plugin reconciliation inspects node labels to avoid selecting a node
  # that already advertises nvidia.com/gpu from a real provider.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # The synthetic GPU device plugin DaemonSet is operator-owned.
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The singleton configuration: read it for admission, publish reconciled
  # profile metadata in status.
  - apiGroups:
      - vcr.opendatahub-io
    resources:
      - vcrgpuclusters
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - vcr.opendatahub-io
    resources:
      - vcrgpuclusters/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - vcr.opendatahub-io
    resources:
      - vcrgpuclusters/finalizers
    verbs:
      - update
  # Reconcile diagnostics. Event payloads never carry Secret values.
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
