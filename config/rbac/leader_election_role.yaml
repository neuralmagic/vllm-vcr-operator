# Leader election stays inside the operator namespace and is scoped to the single
# lease the manager requests (LeaderElectionID in cmd/manager/main.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-vcr-operator-leader-election-role
  namespace: vllm-vcr-operator-system
  labels:
    app.kubernetes.io/name: vllm-vcr-operator
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - vllm-vcr-operator.vcr.opendatahub-io
    verbs:
      - get
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - list
      - watch
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
