# Mutating admission for Pods: translates GPU-requesting vLLM workloads into the
# simulated runtime layout (see docs/contracts/admission.md).
#
# - failurePolicy Fail: an applicable Pod is never admitted untranslated.
# - sideEffects NoneOnDryRun: the response is only a patch, but a non-dry-run
#   request also projects the profile pull Secret into the workload namespace.
#   Dry-run requests write nothing, which is what NoneOnDryRun declares.
# - reinvocationPolicy is intentionally unset (defaults to Never): admission is
#   idempotent, so leaving it unset keeps the API server from re-running it.
# - The operator namespace is excluded so the operator's own Pods are never
#   translated.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vllm-vcr-operator-mutating-webhook
  labels:
    app.kubernetes.io/name: vllm-vcr-operator
    app.kubernetes.io/component: webhook
webhooks:
  - name: pod-mutator.vcr.opendatahub-io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: vllm-vcr-operator-webhook-service
        namespace: vllm-vcr-operator-system
        path: /mutate-v1-pod
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - vllm-vcr-operator-system
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: Namespaced
    sideEffects: NoneOnDryRun
    timeoutSeconds: 10
