# Validating admission for the singleton SimulationEnvironment configuration.
#
# - The CRD already enforces the name "default" through a CEL rule; this webhook
#   is defense in depth plus the transition rules that CEL cannot express
#   (capacity reduction, ambiguous profile/gpu transitions).
# - failurePolicy Fail: a configuration change must never bypass validation.
# - A namespaceSelector is not set because the resource is cluster scoped.
# - admission is never requested for DELETE-only changes, so deletion stays
#   possible even if the webhook is unavailable; operations are CREATE and UPDATE.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: vllm-vcr-operator-validating-webhook
  labels:
    app.kubernetes.io/name: vllm-vcr-operator
    app.kubernetes.io/component: webhook
webhooks:
  - name: simulationenvironment-validator.vcr.opendatahub-io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: vllm-vcr-operator-webhook-service
        namespace: vllm-vcr-operator-system
        path: /validate-vcr-opendatahub-io-v1alpha1-simulationenvironment
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - apiGroups:
          - vcr.opendatahub-io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - simulationenvironments
        scope: Cluster
    sideEffects: None
    timeoutSeconds: 10
